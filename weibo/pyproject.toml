[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weibo"
version = "0.1.0"
description = "横屏视频转竖屏：分割 → Seedance 2.0 重制 → 合并"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "tos>=2.7.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
weibo = "weibo.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weibo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
